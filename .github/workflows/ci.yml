name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      # No bundler and no gems: everything here is the standard library, so
      # there is nothing to install and nothing to keep in step.
      - run: rake selftest
      - run: rake check_registry
